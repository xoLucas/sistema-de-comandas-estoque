services:
  db:
    image: postgres:17-alpine
    container_name: ladsbeer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-ladsbeer}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ladsbeer}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ladsbeer-network

  app:
    build: .
    container_name: ladsbeer-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123456}@db:5432/${POSTGRES_DB:-ladsbeer}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
    networks:
      - ladsbeer-network

networks:
  ladsbeer-network:
    driver: bridge

volumes:
  postgres_data:
