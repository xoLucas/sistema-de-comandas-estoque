<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#0d1117">
    <title>Lads Beer</title>
    <script>
        (function() {
            const THEME_KEY = 'lads_theme_mode';
            const DEFAULT_THEME = 'dark';
            let mode;
            try {
                mode = localStorage.getItem(THEME_KEY) || DEFAULT_THEME;
            } catch {
                mode = DEFAULT_THEME;
            }
            mode = mode === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', mode);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', mode === 'light' ? '#f6f8fa' : '#0d1117');
        })();
    </script>
    <link rel="stylesheet" href="/static/icons/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css?v=125">
</head>
<body>
    <div class="notification-bell" id="notification-bell" onclick="toggleNotificationPanel(event)" style="display:none;">
        <span class="bell-icon"><i class="bi bi-bell-fill"></i></span>
        <span class="badge" id="notification-badge" style="display:none;">0</span>
    </div>

    <div class="notification-panel" id="notification-panel" style="display:none;">
        <div class="notification-panel-header">
            <h3>Notificações</h3>
            <button class="btn-icon" onclick="closeNotificationPanel(event)"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="notification-filter-tabs" id="notification-filter-tabs" style="display:none;">
            <div class="tab active" onclick="setNotificationFilter('active')">Ativas</div>
            <div class="tab" onclick="setNotificationFilter('resolved')">Resolvidas</div>
        </div>
        <div class="notification-list" id="notification-list">
            <div class="notification-empty">Carregando...</div>
        </div>
    </div>

    <div class="notification-panel-overlay" id="notification-panel-overlay" style="display:none;" onclick="closeNotificationPanel(event)"></div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <nav class="bottom-nav" id="bottom-nav" style="display:none;">
        <a href="/" class="nav-item" data-page="mesas">
            <span class="nav-icon"><i class="bi bi-table"></i></span>
            <span class="nav-label">Mesas</span>
        </a>
        <a href="/estoque" class="nav-item" data-page="estoque">
            <span class="nav-icon"><i class="bi bi-box-seam"></i></span>
            <span class="nav-label">Estoque</span>
        </a>
        <a href="/promocoes" class="nav-item" data-page="promocoes" data-require="promotions">
            <span class="nav-icon"><i class="bi bi-tag"></i></span>
            <span class="nav-label">Promoções</span>
        </a>
        <a href="/fornecedores" class="nav-item" data-page="fornecedores" data-require="suppliers">
            <span class="nav-icon"><i class="bi bi-truck"></i></span>
            <span class="nav-label">Fornecedores</span>
        </a>
        <a href="/clientes" class="nav-item" data-page="clientes" data-require="customers">
            <span class="nav-icon"><i class="bi bi-people"></i></span>
            <span class="nav-label">Clientes</span>
        </a>
        <a href="/consignados" class="nav-item" data-page="consignados" data-require="consignments">
            <span class="nav-icon"><i class="bi bi-clipboard-check"></i></span>
            <span class="nav-label">Consignados</span>
        </a>
        <a href="/funcionarios" class="nav-item" data-page="funcionarios" data-require="employees">
            <span class="nav-icon"><i class="bi bi-person-badge"></i></span>
            <span class="nav-label">Funcionários</span>
        </a>
        <a href="/configuracoes" class="nav-item" data-page="configuracoes" data-require="settings">
            <span class="nav-icon"><i class="bi bi-gear"></i></span>
            <span class="nav-label">Ajustes</span>
        </a>
        <a href="/financeiro" class="nav-item" data-page="financeiro" data-require="financial">
            <span class="nav-icon"><i class="bi bi-cash-coin"></i></span>
            <span class="nav-label">Financeiro</span>
        </a>
        <a href="/dashboards" class="nav-item" data-page="dashboards" data-require="dashboards">
            <span class="nav-icon"><i class="bi bi-graph-up-arrow"></i></span>
            <span class="nav-label">Dashboards</span>
        </a>
        <a href="#" class="nav-item" onclick="logout()">
            <span class="nav-icon"><i class="bi bi-box-arrow-right"></i></span>
            <span class="nav-label">Sair</span>
        </a>
    </nav>

    <div id="name-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Registro de Garçom</h3>
            <p>Identifique-se para continuar:</p>
            <input type="text" id="register-name-input" placeholder="Seu nome completo" class="input-field" autocomplete="name">
            <button onclick="registerName()" class="btn-primary-full">Confirmar</button>
            <p id="name-modal-error" class="error-msg" style="display:none;"></p>
        </div>
    </div>

    <div id="customer-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="customer-modal-title">Novo Cliente</h3>
            <input type="hidden" id="customer-id">
            <label class="input-label">Nome *</label>
            <input type="text" id="customer-name" class="input-field" placeholder="Nome completo">
            <label class="input-label">Telefone</label>
            <input type="text" id="customer-phone" class="input-field" placeholder="(00) 00000-0000" oninput="this.value = maskPhone(this.value)">
            <label class="input-label">E-mail</label>
            <input type="email" id="customer-email" class="input-field" placeholder="email@exemplo.com">
            <label class="input-label">CPF/CNPJ</label>
            <input type="text" id="customer-document" class="input-field" placeholder="000.000.000-00" oninput="this.value = maskCpfCnpj(this.value)">
            <label class="input-label">Data de nascimento</label>
            <input type="date" id="customer-birth-date" class="input-field">
            <label class="input-label">Tipo</label>
            <select id="customer-type" class="select-field">
                <option value="pf">Pessoa Física</option>
                <option value="pj">Pessoa Jurídica</option>
            </select>
            <label class="input-label">Observações</label>
            <textarea id="customer-notes" class="input-field" rows="2"></textarea>
            <label class="input-label">
                <input type="checkbox" id="customer-active" checked> Ativo
            </label>
            <p id="customer-error" class="error-msg" style="display:none;"></p>
            <div style="display:flex;gap:8px;margin-top:12px;">
                <button onclick="submitCustomer()" class="btn-primary-full" style="flex:1;">Salvar</button>
                <button onclick="closeCustomerModal()" class="btn-secondary-full" style="flex:1;">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="scroll-helper" class="scroll-helper" aria-label="Atalhos de rolagem">
        <button type="button" onclick="scrollToTop()" title="Ir ao topo">↑</button>
        <button type="button" onclick="scrollToBottom()" title="Ir ao final">↓</button>
    </div>

    <script src="/static/chart.min.js?v=121"></script>
    <script src="/static/app.js?v=121"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = getToken();
            if (token) {
                document.getElementById('notification-bell').style.display = 'flex';
                connectNotificationsWebSocket();
                loadNotifications();
                connectStockWebSocket();
            }
            initScrollHelper();
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
