{% extends "base.html" %}
{% block content %}
<header>
    <h1>CLIENTES</h1>
    <p class="subtitle">Cadastro e histórico de consumo</p>
</header>

<div class="filter-bar">
    <input type="text" id="customer-search" oninput="loadCustomers()" placeholder="Buscar cliente..." class="input-field">
    <span class="filter-label">Status:</span>
    <select id="customer-filter-active" onchange="loadCustomers()" class="select-field">
        <option value="">Todos</option>
        <option value="active" selected>Ativos</option>
        <option value="inactive">Inativos</option>
    </select>
    <span class="filter-label">Tipo:</span>
    <select id="customer-filter-type" onchange="loadCustomers()" class="select-field">
        <option value="" selected>Todos</option>
        <option value="pf">Pessoa Física</option>
        <option value="pj">Pessoa Jurídica</option>
    </select>
    <span class="filter-label">Ordenar:</span>
    <select id="customer-sort" onchange="loadCustomers()" class="select-field" title="Ordenar por">
        <option value="name">Nome</option>
        <option value="total_spent">Maior faturamento</option>
        <option value="last_visit">Última visita</option>
        <option value="visit_count">Número de visitas</option>
    </select>
    <button onclick="showCustomerModal()" class="btn-primary">Novo Cliente</button>
</div>

<div id="customers-list" class="sales-list">
    <div class="loading">Carregando...</div>
</div>

<div id="customer-dashboard-modal" class="modal" style="display:none;">
    <div class="modal-content customer-dashboard-content">
        <h3 id="dashboard-customer-name">Dashboard do Cliente</h3>

        <div class="customer-summary-cards">
            <div class="customer-summary-card">
                <span class="customer-summary-label">Consumo Total</span>
                <span class="customer-summary-value" id="dash-total-spent">R$ 0,00</span>
            </div>
            <div class="customer-summary-card">
                <span class="customer-summary-label">Visitas</span>
                <span class="customer-summary-value" id="dash-visit-count">0</span>
            </div>
            <div class="customer-summary-card">
                <span class="customer-summary-label">Última Visita</span>
                <span class="customer-summary-value" id="dash-last-visit">-</span>
            </div>
        </div>

        <div class="customer-dashboard-filter">
            <label class="input-label">Ano</label>
            <select id="dashboard-year" onchange="loadCustomerDashboard()" class="select-field"></select>
        </div>

        <div class="customer-chart-block">
            <h4>Visitas por Mês</h4>
            <div id="month-chart" class="customer-chart-container"></div>
        </div>

        <div class="customer-chart-block">
            <h4>Visitas por Dia da Semana</h4>
            <div id="weekday-chart" class="customer-chart-container"></div>
        </div>

        <button onclick="closeCustomerDashboardModal()" class="btn-secondary-full">Fechar</button>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.body.classList.add('clientes-page');
document.addEventListener('DOMContentLoaded', () => {
    checkAuth((user) => {
        if (!requirePageAccess(['gerente', 'caixa', 'garcom'])) return;
        document.getElementById('bottom-nav').style.display = 'flex';
        highlightNav('clientes');
        hideCreateCustomerButtonsIfNoPermission();
        loadCustomers();
    });
});
</script>
{% endblock %}
