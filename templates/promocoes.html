{% extends "base.html" %}
{% block content %}
<header>
    <h1>PROMOÇÕES</h1>
    <p class="subtitle">Gerencie promoções e descontos</p>
</header>

<div class="promo-summary" id="promo-summary">
    <div class="summary-card status-ativa">
        <span class="summary-count" id="count-ativa">0</span>
        <span class="summary-label">Ativas</span>
    </div>
    <div class="summary-card status-agendada">
        <span class="summary-count" id="count-agendada">0</span>
        <span class="summary-label">Agendadas</span>
    </div>
    <div class="summary-card status-expirada">
        <span class="summary-count" id="count-expirada">0</span>
        <span class="summary-label">Expiradas</span>
    </div>
    <div class="summary-card status-desativada">
        <span class="summary-count" id="count-desativada">0</span>
        <span class="summary-label">Desativadas</span>
    </div>
</div>

<div id="promotions-list" class="promotions-list">
    <div class="loading">Carregando...</div>
</div>

<div class="actions-stack">
    <button onclick="showPromotionModal()" class="btn-primary-full">Nova Promoção</button>
</div>

<div id="promotion-modal" class="modal" style="display:none;">
    <div class="modal-content modal-large">
        <h3 id="promotion-modal-title">Nova Promoção</h3>
        <input type="hidden" id="promotion-id">

        <label class="input-label">Nome *</label>
        <input type="text" id="promotion-name" class="input-field" placeholder="Ex: Happy Hour Cerveja">

        <label class="input-label">Descrição</label>
        <input type="text" id="promotion-description" class="input-field" placeholder="Opcional">

        <div class="form-row">
            <div class="form-col">
                <label class="input-label">Desconto (%)</label>
                <input type="number" step="0.01" id="promotion-discount" class="input-field" placeholder="0,00">
            </div>
            <div class="form-col">
                <label class="input-label">Início</label>
                <input type="datetime-local" id="promotion-start" class="input-field">
            </div>
            <div class="form-col">
                <label class="input-label">Término</label>
                <input type="datetime-local" id="promotion-end" class="input-field">
            </div>
        </div>

        <label class="input-label">Produtos</label>
        <div id="promotion-products" class="checkbox-list"></div>

        <div class="toggle-row" style="margin-top:8px;">
            <span class="toggle-label" id="promotion-active-label">Promoção ativa</span>
            <label class="toggle-switch">
                <input type="checkbox" id="promotion-active" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>

        <p id="promotion-error" class="error-msg" style="display:none;"></p>
        <button onclick="submitPromotion()" class="btn-primary-full" style="margin-top:12px;">Salvar</button>
        <button onclick="closePromotionModal()" class="btn-secondary-full">Cancelar</button>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    checkAuth((user) => {
        document.getElementById('bottom-nav').style.display = 'flex';
        highlightNav('promocoes');
        loadPromotions();
    });
});
</script>
{% endblock %}
